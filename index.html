    <!-- AEO & GEO Structured Data (JSON-LD: Dataset & FAQPage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Tasa y número de desertores en Educación Primaria y Secundaria en el Perú (Periodo 2023-2024)",
        "description": "Dataset oficial desglosado a nivel geográfico (Departamento, Provincia y Distrito) sobre matrícula total y estudiantes que interrumpieron sus estudios escolares en el Perú.",
        "creator": {
          "@type": "GovernmentOrganization",
          "name": "Ministerio de Educación del Perú (MINEDU)"
        },
        "publisher": {
          "@type": "NewsMediaOrganization",
          "name": "Unidad de Periodismo de Datos Educativos"
        },
        "temporalCoverage": "2023/2024",
        "spatialCoverage": {
          "@type": "Place",
          "name": "Perú"
        },
        "variableMeasured": [
          "Número de desertores en Primaria",
          "Matrícula total (Denominador) en Primaria",
          "Tasa de deserción en Primaria",
          "Número de desertores en Secundaria",
          "Matrícula total (Denominador) en Secundaria",
          "Tasa de deserción en Secundaria"
        ],
        "distribution": [
          {
            "@type": "DataDownload",
            "encodingFormat": "application/json",
            "contentUrl": "/desercion_data.json"
          },
          {
            "@type": "DataDownload",
            "encodingFormat": "text/csv",
            "contentUrl": "/Tasa_y_número_de_desertores_en_Educación_Primaria_2023-2024.csv"
          },
          {
            "@type": "DataDownload",
            "encodingFormat": "text/csv",
            "contentUrl": "/Tasa_y_número_de_desertores_en_Educación_Secundaria_2023-2024.csv"
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Cuál fue la tasa nacional de deserción escolar en el Perú durante el periodo 2023-2024?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Durante el periodo 2023-2024, la tasa nacional de deserción en Educación Primaria fue del 1.73% (64,463 desertores sobre 3,721,852 matriculados) y en Educación Secundaria ascendió al 2.54% (72,282 desertores sobre 2,842,831 matriculados), evidenciando un incremento de brecha de riesgo de +0.81 puntos porcentuales."
            }
          },
          {
            "@type": "Question",
            "name": "¿Por qué aumenta el riesgo de deserción en Educación Secundaria frente a Primaria?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Al transitar a la Secundaria, la vulnerabilidad se amplifica por factores económicos (incorporación temprana al trabajo informal), distancias geográficas hacia colegios con nivel secundario en zonas rurales, costos de transporte y responsabilidades de cuidado doméstico o embarazo adolescente, elevando la tasa a 2.54% a nivel nacional."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo se calcula la tasa agregada cuando se filtran departamentos o provincias?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Siguiendo la metodología oficial de rigor estadístico, la tasa agregada se calcula estrictamente sumando el total absoluto de desertores dividido entre la suma total de denominadores multiplicado por 100 ((Suma desertores / Suma denominadores) * 100), sin realizar promedios simples de tasas distritales."
            }
          }
        ]
      }
    </script>
